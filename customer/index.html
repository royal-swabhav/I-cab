<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-cab - Book a Ride</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <!-- Auth Screen -->
        <div id="authBox" style="text-align: center; padding: 25px 0;">
            <h2><span class="brand">I-cab</span> Passenger</h2>
            <p style="color: #747d8c; margin: 10px 0 20px;">Sign in to set your own price and book rides</p>
            <button id="custLoginBtn" class="btn">Sign In with Google</button>
        </div>

        <!-- Booking Section -->
        <div id="bookingSection" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h3 id="welcomeCust">Hello Passenger</h3>
                <button id="custLogoutBtn" class="btn btn-secondary" style="width: auto; padding: 5px 12px; font-size: 12px;">Logout</button>
            </div>

            <div id="rateInfo" style="margin-bottom: 12px; font-size: 13px; font-weight: bold; color: #e67e22;">Loading base fare...</div>

            <form id="bookingForm">
                <div class="form-group">
                    <label>Your Mobile Number</label>
                    <input type="tel" id="custPhone" placeholder="10-digit mobile number" required>
                </div>
                <div class="form-group">
                    <label>Pickup Location</label>
                    <input type="text" id="pickup" placeholder="Current address / Landmark" required>
                </div>
                <div class="form-group">
                    <label>Drop Location</label>
                    <input type="text" id="drop" placeholder="Where do you want to go?" required>
                </div>
                <div class="form-group">
                    <label>Your Offer Price (₹)</label>
                    <input type="number" id="fare" placeholder="Offer your fare" required>
                </div>
                <button type="submit" class="btn">Find Driver</button>
            </form>

            <h3 style="margin-top: 25px;">My Ride History</h3>
            <div id="customerRides">No active requests.</div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, provider, signInWithPopup, signOut, onAuthStateChanged,
            db, collection, addDoc, doc, setDoc, getDoc, onSnapshot, serverTimestamp 
        } from "../firebase-config.js";

        let currentUser = null;
        let minFare = 50;

        document.getElementById('custLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => alert(err.message));
        });

        document.getElementById('custLogoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authBox').style.display = "none";
                document.getElementById('bookingSection').style.display = "block";
                document.getElementById('welcomeCust').innerText = `Hi, ${user.displayName}`;

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().phone) {
                    document.getElementById('custPhone').value = userDoc.data().phone;
                }

                listenToMyRides(user.uid);
            } else {
                currentUser = null;
                document.getElementById('authBox').style.display = "block";
                document.getElementById('bookingSection').style.display = "none";
            }
        });

        onSnapshot(doc(db, "settings", "global"), (snap) => {
            if (snap.exists()) {
                minFare = snap.data().minFare || 50;
                document.getElementById('rateInfo').innerText = `Admin minimum base offer: ₹${minFare}`;
                document.getElementById('fare').min = minFare;
            }
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fare = Number(document.getElementById('fare').value);
            const phone = document.getElementById('custPhone').value.trim();

            if (fare < minFare) {
                alert(`Offer price cannot be less than ₹${minFare}`);
                return;
            }

            await setDoc(doc(db, "users", currentUser.uid), {
                name: currentUser.displayName,
                email: currentUser.email,
                phone: phone
            }, { merge: true });

            await addDoc(collection(db, "rides"), {
                customerId: currentUser.uid,
                customerName: currentUser.displayName,
                customerPhone: phone,
                pickup: document.getElementById('pickup').value,
                drop: document.getElementById('drop').value,
                fare: fare,
                driverName: "None",
                driverPhone: "",
                status: "pending",
                createdAt: serverTimestamp()
            });

            alert("Ride request posted to drivers!");
        });

        function listenToMyRides(userId) {
            onSnapshot(collection(db, "rides"), (snapshot) => {
                const list = document.getElementById('customerRides');
                list.innerHTML = "";

                snapshot.forEach((snap) => {
                    const ride = snap.data();
                    if (ride.customerId === userId) {
                        const card = document.createElement('div');
                        card.className = "card";
                        card.innerHTML = `
                            <div class="card-row">
                                <strong>${ride.pickup} ➔ ${ride.drop}</strong>
                                <span class="price">₹${ride.fare}</span>
                            </div>
                            <p>Status: <span class="badge badge-${ride.status}">${ride.status}</span></p>
                            
                            ${ride.status === 'accepted' ? `
                                <div style="background:#e8f8f5; border:1px solid #2ecc71; padding:10px; border-radius:6px; margin-top:8px;">
                                    <h4 style="color:#27ae60;">Driver Assigned!</h4>
                                    <p><strong>Driver:</strong> ${ride.driverName}</p>
                                    <p style="font-size:15px; margin-top:4px;">
                                        <strong>Phone:</strong> <a href="tel:${ride.driverPhone}" style="color:#2980b9; font-weight:bold;">📞 ${ride.driverPhone}</a>
                                    </p>
                                </div>
                            ` : `
                                <p style="color:#747d8c; font-size:12px; margin-top:6px;">Driver phone number will appear once accepted.</p>
                            `}
                        `;
                        list.prepend(card);
                    }
                });
            });
        }
    </script>
</body>
</html>
