<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-cab Passenger</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <!-- Auth Screen -->
        <div id="authBox" style="text-align: center; padding: 25px 0;">
            <h2><span class="brand">I-cab</span> Passenger</h2>
            <p style="color: #747d8c; margin: 10px 0 20px;">Apna kiraya khud tay karein</p>
            <button id="custLoginBtn" class="btn">Sign In with Google</button>
        </div>

        <!-- Booking Section -->
        <div id="bookingSection" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h3 id="welcomeCust">Hello Passenger</h3>
                <button id="custLogoutBtn" class="btn btn-secondary" style="width: auto; padding: 5px 12px; font-size: 12px;">Logout</button>
            </div>

            <div id="rateInfo" style="margin-bottom: 12px; font-size: 13px; font-weight: bold; color: #e67e22;">Loading base fare...</div>

            <form id="bookingForm">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="custPhone" placeholder="10-digit mobile number" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Ride Date</label>
                        <input type="date" id="rideDate" required>
                    </div>
                    <div class="form-group">
                        <label>Ride Time</label>
                        <input type="time" id="rideTime" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Passengers</label>
                        <select id="passengerCount">
                            <option value="1">1 Passenger</option>
                            <option value="2" selected>2 Passengers</option>
                            <option value="3">3 Passengers</option>
                            <option value="4">4 Passengers</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ride Category</label>
                        <select id="rideType">
                            <option value="Private ride">Private ride</option>
                            <option value="Shared / Pool">Shared ride</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pickup Location (Point A)</label>
                    <input type="text" id="pickup" placeholder="e.g. Swargate, Pune" required>
                </div>
                <div class="form-group">
                    <label>Drop Location (Point B)</label>
                    <input type="text" id="drop" placeholder="e.g. Panvel, Navi Mumbai" required>
                </div>
                <div class="form-group">
                    <label>Your Offer Price (₹)</label>
                    <input type="number" id="fare" placeholder="Kitna kiraya offer karenge?" required>
                </div>

                <div style="background:#eefbf3; border-left: 4px solid #2ed573; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; color: #1e824c; font-weight: 600;">
                    ✓ Toll tax is already included in this price
                </div>

                <button type="submit" class="btn">Find Driver</button>
            </form>

            <h3 style="margin-top: 25px;">My Active Rides & Driver Offers</h3>
            <div id="customerRides">No active requests.</div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, provider, signInWithPopup, signOut, onAuthStateChanged,
            db, collection, addDoc, doc, setDoc, getDoc, onSnapshot, runTransaction, serverTimestamp 
        } from "../firebase-config.js";

        let currentUser = null;
        let minFare = 50;

        const now = new Date();
        document.getElementById('rideDate').value = now.toISOString().split('T')[0];
        document.getElementById('rideTime').value = now.toTimeString().slice(0,5);

        document.getElementById('custLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => alert(err.message));
        });

        document.getElementById('custLogoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authBox').style.display = "none";
                document.getElementById('bookingSection').style.display = "block";
                document.getElementById('welcomeCust').innerText = `Hi, ${user.displayName}`;

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().phone) {
                    document.getElementById('custPhone').value = userDoc.data().phone;
                }

                listenToMyRides(user.uid);
            } else {
                currentUser = null;
                document.getElementById('authBox').style.display = "block";
                document.getElementById('bookingSection').style.display = "none";
            }
        });

        onSnapshot(doc(db, "settings", "global"), (snap) => {
            if (snap.exists()) {
                minFare = snap.data().minFare || 50;
                document.getElementById('rateInfo').innerText = `Admin minimum base offer: ₹${minFare}`;
                document.getElementById('fare').min = minFare;
            }
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fare = Number(document.getElementById('fare').value);
            const phone = document.getElementById('custPhone').value.trim();

            if (fare < minFare) {
                alert(`Offer price cannot be less than ₹${minFare}`);
                return;
            }

            await setDoc(doc(db, "users", currentUser.uid), {
                name: currentUser.displayName,
                email: currentUser.email,
                phone: phone
            }, { merge: true });

            await addDoc(collection(db, "rides"), {
                customerId: currentUser.uid,
                customerName: currentUser.displayName,
                customerPhone: phone,
                pickup: document.getElementById('pickup').value,
                drop: document.getElementById('drop').value,
                rideDate: document.getElementById('rideDate').value,
                rideTime: document.getElementById('rideTime').value,
                passengerCount: Number(document.getElementById('passengerCount').value),
                rideType: document.getElementById('rideType').value,
                fare: fare,
                status: "pending",
                driverId: "",
                driverName: "",
                driverPhone: "",
                driverVehicle: "",
                driverOfferFare: 0,
                tollIncluded: true,
                createdAt: serverTimestamp()
            });

            alert("Ride request sent! Waiting for drivers...");
        });

        function listenToMyRides(userId) {
            onSnapshot(collection(db, "rides"), (snapshot) => {
                const list = document.getElementById('customerRides');
                list.innerHTML = "";

                snapshot.forEach((snap) => {
                    const ride = snap.data();
                    const id = snap.id;

                    if (ride.customerId === userId) {
                        const card = document.createElement('div');
                        card.className = "card";
                        
                        let actionHTML = '';

                        if (ride.status === 'pending') {
                            actionHTML = `<p style="color:#747d8c; font-size:13px; margin-top:8px;">Drivers ko notify kar diya gaya hai...</p>`;
                        } else if (ride.status === 'driver_offered') {
                            actionHTML = `
                                <div style="background:#fff8e7; border:1px solid #fed330; padding:12px; border-radius:8px; margin-top:10px;">
                                    <h4 style="color:#d35400;">Driver Proposal Received!</h4>
                                    <p style="margin-top:4px;"><strong>Driver:</strong> ${ride.driverName}</p>
                                    <p><strong>Vehicle:</strong> ${ride.driverVehicle}</p>
                                    <p style="font-size:16px; margin: 6px 0;"><strong>Demand Fare:</strong> <span class="price">₹${ride.driverOfferFare}</span></p>
                                    <button class="btn" onclick="confirmDriverBooking('${id}')">Confirm Driver & Reveal Numbers</button>
                                </div>
                            `;
                        } else if (ride.status === 'confirmed') {
                            actionHTML = `
                                <div style="background:#e8f8f5; border:1px solid #2ecc71; padding:12px; border-radius:8px; margin-top:10px;">
                                    <h4 style="color:#27ae60;">Ride Confirmed!</h4>
                                    <p><strong>Driver:</strong> ${ride.driverName} (${ride.driverVehicle})</p>
                                    <p style="font-size:16px; margin-top:4px;">
                                        <strong>Call Driver:</strong> <a href="tel:${ride.driverPhone}" style="color:#0984e3; font-weight:bold;">📞 ${ride.driverPhone}</a>
                                    </p>
                                </div>
                            `;
                        } else if (ride.status === 'completed') {
                            actionHTML = `<p style="color:#27ae60; font-weight:bold; margin-top:8px;">Trip Completed Successfully</p>`;
                        }

                        card.innerHTML = `
                            <div class="card-row">
                                <strong>${ride.pickup} ➔ ${ride.drop}</strong>
                                <span class="price">₹${ride.status === 'confirmed' ? ride.fare : ride.fare}</span>
                            </div>
                            <p style="font-size:13px; color:#57606f;">📅 <strong>Date:</strong> ${ride.rideDate} | ⏰ <strong>Time:</strong> ${ride.rideTime} | 👥 ${ride.passengerCount || 1} Person</p>
                            <p style="font-size:12px; color:#2ed573; font-weight:600;">✓ Toll tax included</p>
                            <p style="margin-top:4px;">Status: <span class="badge badge-${ride.status}">${ride.status}</span></p>
                            ${actionHTML}
                        `;
                        list.prepend(card);
                    }
                });
            });
        }

        window.confirmDriverBooking = async (rideId) => {
            const rideRef = doc(db, "rides", rideId);
            const settingsSnap = await getDoc(doc(db, "settings", "global"));
            const deductionFee = settingsSnap.exists() ? (settingsSnap.data().driverFeePerOrder || 10) : 10;

            try {
                await runTransaction(db, async (t) => {
                    const rDoc = await t.get(rideRef);
                    if (!rDoc.exists()) throw "Ride record not found!";
                    const ride = rDoc.data();

                    const driverRef = doc(db, "drivers", ride.driverId);
                    const dDoc = await t.get(driverRef);
                    if (!dDoc.exists()) throw "Driver not found!";

                    const currentPoints = dDoc.data().points || 0;
                    if (currentPoints < deductionFee) {
                        throw "Driver ke paas confirm karne ke points nahi hain.";
                    }

                    t.update(driverRef, { points: currentPoints - deductionFee });

                    t.update(rideRef, {
                        status: "confirmed",
                        fare: ride.driverOfferFare,
                        pointsDeducted: deductionFee
                    });
                });

                alert("Driver Confirmed! Dono ko contact numbers unlock ho chuke hain.");
            } catch (err) {
                alert("Error: " + err);
            }
        };
    </script>
</body>
</html>
