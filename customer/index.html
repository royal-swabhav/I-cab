<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../manifest.json">
    <title>I-cab Passenger</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Auth Screen -->
        <div id="authBox" style="text-align: center; padding: 25px 0;">
            <h2><span class="brand">I-cab</span> Passenger</h2>
            <p style="color: #747d8c; margin: 10px 0 20px;">Apna kiraya khud tay karein</p>
            <button id="custLoginBtn" class="btn">Sign In with Google</button>
        </div>

        <!-- Booking Section -->
        <div id="bookingSection" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h3 id="welcomeCust">Hello Passenger</h3>
                <button id="custLogoutBtn" class="btn btn-secondary" style="width: auto; padding: 5px 12px; font-size: 12px;">Logout</button>
            </div>

            <div id="rateInfo" style="margin-bottom: 12px; font-size: 13px; font-weight: bold; color: #e67e22;">Loading base fare...</div>

            <form id="bookingForm">
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="custPhone" placeholder="10-digit mobile number" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Ride Date</label>
                        <input type="date" id="rideDate" required>
                    </div>
                    <div class="form-group">
                        <label>Ride Time</label>
                        <input type="time" id="rideTime" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Passengers</label>
                        <input type="number" id="passengerCount" min="1" max="50" value="1" required>
                    </div>
                    <div class="form-group">
                        <label>Required Car</label>
                        <select id="carType" required>
                            <option value="Mini">Mini (Hatchback)</option>
                            <option value="Sedan">Sedan (Dzire / Etios)</option>
                            <option value="SUV">SUV (Ertiga / Innova)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Pickup Location (Point A)</label>
                    <input type="text" id="pickup" placeholder="Enter pickup address" required>
                </div>
                <div class="form-group">
                    <label>Drop Location (Point B)</label>
                    <input type="text" id="drop" placeholder="Enter destination address" required>
                </div>
                
                <div class="form-group">
                    <label>Your Offer Price (₹)</label>
                    <input type="number" id="fare" placeholder="Kitna offer karenge?" required>
                </div>

                <div class="form-group">
                    <label>Comments / Special Instructions</label>
                    <input type="text" id="comment" placeholder="e.g. 2 luggage bags, AC on...">
                </div>

                <div style="background:#fff3cd; border-left: 4px solid #ff9f43; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; color: #856404; font-weight: 600;">
                    ⚠ Toll tax is NOT included in this price (Toll alag se dena hoga)
                </div>

                <button type="submit" class="btn">Find Drivers</button>
            </form>

            <h3 style="margin-top: 25px;">My Active Rides & Live Driver Bids</h3>
            <div id="customerRides">No active requests.</div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, provider, signInWithPopup, signOut, onAuthStateChanged,
            db, collection, addDoc, doc, setDoc, getDoc, onSnapshot, runTransaction, serverTimestamp 
        } from "../firebase-config.js";
        import { playNotificationSound } from "../sound.js";

        let currentUser = null;
        let minFare = 50;
        let previousBidsCount = {};

        const now = new Date();
        document.getElementById('rideDate').value = now.toISOString().split('T')[0];
        document.getElementById('rideTime').value = now.toTimeString().slice(0,5);

        document.getElementById('custLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => alert(err.message));
        });

        document.getElementById('custLogoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authBox').style.display = "none";
                document.getElementById('bookingSection').style.display = "block";
                document.getElementById('welcomeCust').innerText = `Hi, ${user.displayName}`;

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().phone) {
                    document.getElementById('custPhone').value = userDoc.data().phone;
                }

                listenToMyRides(user.uid);
            } else {
                currentUser = null;
                document.getElementById('authBox').style.display = "block";
                document.getElementById('bookingSection').style.display = "none";
            }
        });

        onSnapshot(doc(db, "settings", "global"), (snap) => {
            if (snap.exists()) {
                minFare = snap.data().minFare || 50;
                document.getElementById('rateInfo').innerText = `Admin minimum base offer: ₹${minFare}`;
                document.getElementById('fare').min = minFare;
            }
        });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fare = Number(document.getElementById('fare').value);
            const phone = document.getElementById('custPhone').value.trim();

            if (fare < minFare) {
                alert(`Offer price cannot be less than ₹${minFare}`);
                return;
            }

            await setDoc(doc(db, "users", currentUser.uid), {
                name: currentUser.displayName,
                email: currentUser.email,
                phone: phone
            }, { merge: true });

            await addDoc(collection(db, "rides"), {
                customerId: currentUser.uid,
                customerName: currentUser.displayName,
                customerPhone: phone,
                pickup: document.getElementById('pickup').value,
                drop: document.getElementById('drop').value,
                rideDate: document.getElementById('rideDate').value,
                rideTime: document.getElementById('rideTime').value,
                passengerCount: Number(document.getElementById('passengerCount').value),
                carType: document.getElementById('carType').value,
                comment: document.getElementById('comment').value.trim(),
                fare: fare,
                status: "pending", // pending -> confirmed -> completed
                driverBids: [], // Array of multiple drivers bidding
                confirmedDriver: null,
                tollIncluded: false,
                createdAt: serverTimestamp()
            });

            alert("Ride request sent! Waiting for drivers...");
        });

        function listenToMyRides(userId) {
            onSnapshot(collection(db, "rides"), (snapshot) => {
                const list = document.getElementById('customerRides');
                list.innerHTML = "";

                snapshot.forEach((snap) => {
                    const ride = snap.data();
                    const id = snap.id;

                    if (ride.customerId === userId) {
                        const bids = ride.driverBids || [];

                        // Audio Tone on new bid incoming
                        if (previousBidsCount[id] !== undefined && bids.length > previousBidsCount[id]) {
                            playNotificationSound();
                        }
                        previousBidsCount[id] = bids.length;

                        const card = document.createElement('div');
                        card.className = "card";

                        let actionHTML = '';

                        if (ride.status === 'pending') {
                            if (bids.length === 0) {
                                actionHTML = `<p style="color:#747d8c; font-size:13px; margin-top:8px;">Finding nearby drivers...</p>`;
                            } else {
                                actionHTML = `<div style="margin-top:10px;"><h4 style="color:#2f3542; margin-bottom:8px;">Offers from Drivers (${bids.length}):</h4>`;
                                bids.forEach((bid, idx) => {
                                    actionHTML += `
                                        <div style="background:#f8f9fa; border:1px solid #ced6e0; border-radius:8px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                                            <div>
                                                <strong>${bid.driverName}</strong> <small style="color:#7f8c8d;">(${bid.driverVehicle})</small>
                                                <div style="color:#2ed573; font-weight:bold; font-size:16px;">₹${bid.offeredFare}</div>
                                            </div>
                                            <button class="btn" style="width:auto; padding:6px 14px;" onclick="chooseDriver('${id}', ${idx})">Accept</button>
                                        </div>
                                    `;
                                });
                                actionHTML += `</div>`;
                            }
                        } else if (ride.status === 'confirmed') {
                            const d = ride.confirmedDriver;
                            const waUrl = `https://wa.me/91${d.driverPhone.replace(/[^0-9]/g, '')}?text=Hi%20${encodeURIComponent(d.driverName)},%20I%20am%20your%20I-cab%20passenger.`;
                            actionHTML = `
                                <div style="background:#e8f8f5; border:1px solid #2ecc71; padding:12px; border-radius:8px; margin-top:10px;">
                                    <h4 style="color:#27ae60;">Ride Confirmed!</h4>
                                    <p><strong>Driver:</strong> ${d.driverName} (${d.driverVehicle})</p>
                                    <div style="display:flex; gap:10px; margin-top:10px;">
                                        <a href="tel:${d.driverPhone}" class="btn" style="background:#0984e3; text-decoration:none;">📞 Call</a>
                                        <a href="${waUrl}" target="_blank" class="btn" style="background:#25D366; text-decoration:none;"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                                    </div>
                                </div>
                            `;
                        } else if (ride.status === 'completed') {
                            actionHTML = `<p style="color:#27ae60; font-weight:bold; margin-top:8px;">Trip Completed</p>`;
                        }

                        card.innerHTML = `
                            <div class="card-row">
                                <strong>${ride.pickup} ➔ ${ride.drop}</strong>
                                <span class="price">₹${ride.confirmedDriver ? ride.confirmedDriver.finalFare : ride.fare}</span>
                            </div>
                            <p style="font-size:13px; color:#57606f;">
                                📅 <strong>Date:</strong> ${ride.rideDate} | ⏰ <strong>Time:</strong> ${ride.rideTime} <br>
                                👥 <strong>Passengers:</strong> ${ride.passengerCount} | 🚗 <strong>Car:</strong> ${ride.carType}
                            </p>
                            ${ride.comment ? `<p style="font-size:13px; background:#f1f2f6; padding:6px 10px; border-radius:6px; margin:6px 0;">💬 <em>"${ride.comment}"</em></p>` : ''}
                            <p style="font-size:12px; color:#d63031; font-weight:600;">⚠ Toll tax NOT included</p>
                            <p style="margin-top:4px;">Status: <span class="badge badge-${ride.status}">${ride.status}</span></p>
                            ${actionHTML}
                        `;
                        list.prepend(card);
                    }
                });
            });
        }

        window.chooseDriver = async (rideId, bidIndex) => {
            const rideRef = doc(db, "rides", rideId);
            const settingsSnap = await getDoc(doc(db, "settings", "global"));
            const deductionFee = settingsSnap.exists() ? (settingsSnap.data().driverFeePerOrder || 10) : 10;

            try {
                await runTransaction(db, async (t) => {
                    const rDoc = await t.get(rideRef);
                    if (!rDoc.exists()) throw "Ride record not found!";
                    const ride = rDoc.data();
                    const chosenBid = ride.driverBids[bidIndex];

                    const driverRef = doc(db, "drivers", chosenBid.driverId);
                    const dDoc = await t.get(driverRef);
                    if (!dDoc.exists()) throw "Driver not found!";

                    const currentPoints = dDoc.data().points || 0;
                    if (currentPoints < deductionFee) {
                        throw "Driver has insufficient points to confirm this ride.";
                    }

                    // 1. Cut Points from the chosen driver
                    t.update(driverRef, { points: currentPoints - deductionFee });

                    // 2. Lock chosen driver & unlock contacts
                    t.update(rideRef, {
                        status: "confirmed",
                        confirmedDriver: {
                            driverId: chosenBid.driverId,
                            driverName: chosenBid.driverName,
                            driverPhone: chosenBid.driverPhone,
                            driverVehicle: chosenBid.driverVehicle,
                            finalFare: chosenBid.offeredFare
                        },
                        pointsDeducted: deductionFee
                    });
                });

                alert("Driver Confirmed! Contacts are unlocked.");
            } catch (err) {
                alert("Error: " + err);
            }
        };
    </script>
</body>
</html>
