<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="../manifest.json">
    <title>I-cab Driver Partner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 75px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #181818;
            border-bottom: 1px solid #282828;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-nav .nav-title {
            font-size: 17px;
            font-weight: 700;
        }

        /* Online / Offline Switch */
        .duty-switch-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .duty-online { background: #a3e635; color: #000; }
        .duty-offline { background: #444; color: #bbb; }

        .wallet-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #1c1c1c;
            border-bottom: 1px solid #2b2b2b;
        }
        .points-box {
            background: #a3e635;
            color: #000;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .feed-container {
            padding: 16px;
        }

        .ride-card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid #2d2d2d;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .card-fare-row {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .passenger-count {
            font-size: 14px;
            font-weight: 400;
            color: #a4b0be;
        }

        .tags-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .tag {
            background: #2b2b2b;
            color: #ccc;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .tag-car { background: #1e3799; color: #ffffff; font-weight: 600; }
        .tag-toll { background: #3d1c1c; color: #ff6b6b; font-weight: 600; }

        .card-route { margin-bottom: 12px; }
        .route-stop {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }
        .dot-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .dot-a { background: #2f80ed; color: #fff; }
        .dot-b { background: #27ae60; color: #fff; }

        .comment-box {
            background: #262626;
            border-left: 3px solid #f5a623;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #f1f2f6;
            margin-bottom: 14px;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #292929;
            padding-top: 12px;
        }
        .avatar-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .btn-action-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-indrive-green {
            flex: 1;
            padding: 12px;
            background: #a3e635;
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-dark-counter {
            flex: 1;
            padding: 12px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            font-weight: 600;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .tab-item {
            text-align: center;
            color: #ffffff;
            font-size: 11px;
            cursor: pointer;
        }
        .tab-item i {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
            color: #a3e635;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #282828;
            border: 1px solid #3a3a3a;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Auth Box -->
    <div id="driverAuthBox" style="padding: 40px 20px; text-align: center;">
        <h2 style="margin-bottom: 8px;"><span style="color:#a3e635;">I-cab</span> Driver Partner</h2>
        <p style="color:#888; font-size:14px; margin-bottom:24px;">Sign in with Google</p>
        <button id="driverLoginBtn" class="btn-indrive-green" style="max-width:320px; padding:14px;">Sign In with Google</button>
    </div>

    <!-- Main Portal -->
    <div id="driverAppSection" style="display: none;">
        <div class="top-nav">
            <div class="nav-title">I-cab Partner</div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button id="dutyToggleBtn" class="duty-switch-btn duty-online">ONLINE</button>
                <button class="duty-switch-btn" style="background:#2a2a2a; color:#fff;" id="driverLogoutBtn">Exit</button>
            </div>
        </div>

        <div class="wallet-strip">
            <div>
                <span style="font-size: 12px; color: #888;">Wallet Balance</span>
                <div style="font-size: 13px; color: #bbb;" id="chargeNotice">Fee: ...</div>
            </div>
            <div class="points-box" id="driverPointsHeader">0 Pts</div>
        </div>

        <div id="driverSetupBox" style="display:none; padding:16px;">
            <div class="ride-card">
                <h4 style="margin-bottom:10px; color:#a3e635;">Driver Registration</h4>
                <input type="tel" id="regPhone" placeholder="Mobile Number (10 Digits)">
                <input type="text" id="regVehicle" placeholder="Vehicle Model & Number (e.g. Swift Dzire MH-12-AB-1234)">
                <button id="submitApplicationBtn" class="btn-indrive-green">Submit for Verification</button>
            </div>
        </div>

        <div id="pendingNotice" style="display:none; padding:16px;">
            <div class="ride-card" style="border-color:#f5a623; text-align:center;">
                <i class="fa-solid fa-clock-rotate-left" style="font-size:32px; color:#f5a623; margin-bottom:10px;"></i>
                <h4 style="margin-bottom:6px;">Verification Pending</h4>
                <p style="font-size:13px; color:#aaa;">Admin will approve and grant points.</p>
            </div>
        </div>

        <div id="offlineNotice" style="display:none; padding:30px 16px; text-align:center;">
            <i class="fa-solid fa-power-off" style="font-size:40px; color:#555; margin-bottom:10px;"></i>
            <h3>You are currently Offline</h3>
            <p style="color:#888; font-size:14px; margin-top:5px;">Switch to Online to receive live passenger requests.</p>
        </div>

        <div id="ridesSection" style="display:none;">
            <div class="feed-container" id="driverRidesList">
                <p style="text-align:center; color:#666; margin-top:30px;">Scanning for requests...</p>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="tab-item">
                <i class="fa-solid fa-car"></i>
                Feed
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, provider, signInWithPopup, signOut, onAuthStateChanged,
            db, collection, doc, setDoc, onSnapshot, runTransaction 
        } from "../firebase-config.js";
        import { playNotificationSound } from "../sound.js";

        let currentUid = null;
        let driverData = null;
        let deductionFee = 10;
        let isOnline = true;
        let lastRidesCount = 0;

        document.getElementById('driverLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => alert(err.message));
        });

        document.getElementById('driverLogoutBtn').addEventListener('click', () => {
            if(confirm("Logout?")) signOut(auth);
        });

        // Duty Online / Offline Toggle
        const dutyToggleBtn = document.getElementById('dutyToggleBtn');
        dutyToggleBtn.addEventListener('click', () => {
            isOnline = !isOnline;
            if (isOnline) {
                dutyToggleBtn.innerText = "ONLINE";
                dutyToggleBtn.className = "duty-switch-btn duty-online";
                document.getElementById('ridesSection').style.display = "block";
                document.getElementById('offlineNotice').style.display = "none";
            } else {
                dutyToggleBtn.innerText = "OFFLINE";
                dutyToggleBtn.className = "duty-switch-btn duty-offline";
                document.getElementById('ridesSection').style.display = "none";
                document.getElementById('offlineNotice').style.display = "block";
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUid = user.uid;
                document.getElementById('driverAuthBox').style.display = "none";
                document.getElementById('driverAppSection').style.display = "block";
                listenToProfile(user);
            } else {
                currentUid = null;
                document.getElementById('driverAuthBox').style.display = "block";
                document.getElementById('driverAppSection').style.display = "none";
            }
        });

        onSnapshot(doc(db, "settings", "global"), (snap) => {
            if (snap.exists()) {
                deductionFee = snap.data().driverFeePerOrder || 10;
                document.getElementById('chargeNotice').innerText = `Deduction: ${deductionFee} Pts per ride`;
            }
        });

        function listenToProfile(user) {
            onSnapshot(doc(db, "drivers", user.uid), (docSnap) => {
                const setupBox = document.getElementById('driverSetupBox');
                const pendingNotice = document.getElementById('pendingNotice');
                const ridesSection = document.getElementById('ridesSection');
                const pointsHeader = document.getElementById('driverPointsHeader');

                if (!docSnap.exists()) {
                    setupBox.style.display = "block";
                    pendingNotice.style.display = "none";
                    ridesSection.style.display = "none";
                    return;
                }

                driverData = docSnap.data();
                pointsHeader.innerText = `${driverData.points || 0} Pts`;

                if (driverData.status === "approved") {
                    setupBox.style.display = "none";
                    pendingNotice.style.display = "none";
                    if (isOnline) ridesSection.style.display = "block";
                    listenToRidesFeed();
                } else {
                    setupBox.style.display = "none";
                    pendingNotice.style.display = "block";
                    ridesSection.style.display = "none";
                }
            });
        }

        document.getElementById('submitApplicationBtn').addEventListener('click', async () => {
            const phone = document.getElementById('regPhone').value.trim();
            const vehicle = document.getElementById('regVehicle').value.trim();

            if (!phone || !vehicle) {
                alert("Fill mobile and vehicle info!");
                return;
            }

            await setDoc(doc(db, "drivers", currentUid), {
                uid: currentUid,
                name: auth.currentUser.displayName,
                email: auth.currentUser.email,
                phone: phone,
                vehicle: vehicle,
                status: "pending",
                points: 0,
                submittedAt: new Date()
            });

            alert("Submitted for review!");
        });

        function listenToRidesFeed() {
            onSnapshot(collection(db, "rides"), (snapshot) => {
                const list = document.getElementById('driverRidesList');
                list.innerHTML = "";
                let count = 0;

                // Sound Alert on New Request
                if (snapshot.size > lastRidesCount && isOnline) {
                    playNotificationSound();
                }
                lastRidesCount = snapshot.size;

                snapshot.forEach((snap) => {
                    const ride = snap.data();
                    const id = snap.id;
                    const bids = ride.driverBids || [];
                    const myBid = bids.find(b => b.driverId === currentUid);
                    const isConfirmedForMe = ride.status === "confirmed" && ride.confirmedDriver && ride.confirmedDriver.driverId === currentUid;

                    if (ride.status === "pending" || isConfirmedForMe) {
                        count++;
                        const card = document.createElement('div');
                        card.className = "ride-card";

                        let actionButtons = '';

                        if (ride.status === "pending") {
                            if (myBid) {
                                actionButtons = `
                                    <div style="background:#262215; border:1px solid #73510e; border-radius:10px; padding:12px; margin-top:12px; text-align:center;">
                                        <span style="color:#f5a623; font-weight:700;">Offer Placed: ₹${myBid.offeredFare}</span>
                                        <p style="font-size:12px; color:#aaa; margin-top:4px;">Waiting for passenger choice...</p>
                                    </div>
                                `;
                            } else {
                                actionButtons = `
                                    <div class="btn-action-row">
                                        <button class="btn-indrive-green" onclick="submitBid('${id}', ${ride.fare})">Accept ₹${ride.fare}</button>
                                        <button class="btn-dark-counter" onclick="counterBid('${id}', ${ride.fare})">Offer Higher (+₹)</button>
                                    </div>
                                `;
                            }
                        } else if (isConfirmedForMe) {
                            const waUrl = `https://wa.me/91${ride.customerPhone.replace(/[^0-9]/g, '')}?text=Hi%20${encodeURIComponent(ride.customerName)},%20I%20am%20your%20I-cab%20driver.`;
                            actionButtons = `
                                <div style="background:#13281a; border:1px solid #27ae60; border-radius:10px; padding:12px; margin-top:12px;">
                                    <div style="color:#2ed573; font-weight:700; margin-bottom:4px;">Booking Confirmed!</div>
                                    <p style="font-size:15px; margin-bottom:10px;">Passenger: 📞 ${ride.customerPhone}</p>
                                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                                        <a href="tel:${ride.customerPhone}" class="btn-indrive-green" style="background:#0984e3; color:#fff;">Call</a>
                                        <a href="${waUrl}" target="_blank" class="btn-indrive-green" style="background:#25D366; color:#fff;"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                                    </div>
                                    <button class="btn-indrive-green" style="background:#ff4757; color:#fff;" onclick="completeRide('${id}')">Finish Trip</button>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="card-fare-row">
                                ₹${myBid ? myBid.offeredFare : ride.fare} 
                                <span class="passenger-count">for ${ride.passengerCount || 1} passenger${(ride.passengerCount || 1) > 1 ? 's' : ''}</span>
                            </div>

                            <div class="tags-row">
                                <span class="tag tag-car"><i class="fa-solid fa-car-side"></i> ${ride.carType || 'Car'}</span>
                                <span class="tag tag-toll">⚠ Toll NOT included</span>
                                <span class="tag">${bids.length} Offers</span>
                            </div>

                            <div class="card-route">
                                <div class="route-stop">
                                    <div class="dot-indicator dot-a">A</div>
                                    <div class="route-text-sub">${ride.pickup}</div>
                                </div>
                                <div class="route-stop">
                                    <div class="dot-indicator dot-b">B</div>
                                    <div class="route-text-sub">${ride.drop}</div>
                                </div>
                            </div>

                            ${ride.comment ? `<div class="comment-box"><i class="fa-regular fa-comment-dots"></i> <strong>Note:</strong> ${ride.comment}</div>` : ''}

                            <div class="user-row">
                                <div class="avatar-circle"><i class="fa-solid fa-user"></i></div>
                                <div><h5>${ride.customerName}</h5></div>
                            </div>

                            ${actionButtons}
                        `;
                        list.appendChild(card);
                    }
                });

                if (count === 0) {
                    list.innerHTML = `<p style="text-align:center; color:#666; margin-top:40px;">No rides available right now.</p>`;
                }
            });
        }

        window.submitBid = async (rideId, fare) => {
            if ((driverData.points || 0) < deductionFee) {
                alert(`Insufficient Balance! Min ${deductionFee} points required.`);
                return;
            }

            const rideRef = doc(db, "rides", rideId);
            await runTransaction(db, async (t) => {
                const rDoc = await t.get(rideRef);
                if (rDoc.data().status !== "pending") throw "Ride no longer active!";

                const existingBids = rDoc.data().driverBids || [];
                existingBids.push({
                    driverId: currentUid,
                    driverName: driverData.name,
                    driverPhone: driverData.phone,
                    driverVehicle: driverData.vehicle,
                    offeredFare: Number(fare)
                });

                t.update(rideRef, { driverBids: existingBids });
            });

            alert("Bid submitted to passenger!");
        };

        window.counterBid = async (rideId, currentFare) => {
            if ((driverData.points || 0) < deductionFee) {
                alert(`Insufficient points!`);
                return;
            }

            const counter = prompt(`Customer offer ₹${currentFare} hai. Apna rate enter karein (₹):`, currentFare + 100);
            if (counter && Number(counter) > 0) {
                await window.submitBid(rideId, Number(counter));
            }
        };

        window.completeRide = async (rideId) => {
            await runTransaction(db, async (t) => {
                t.update(doc(db, "rides", rideId), { status: "completed" });
            });
            alert("Trip completed successfully!");
        };
    </script>
</body>
</html>
